name: Capture actual live RealShift screenshots
on:
  push:
    branches: [arena/c802f41f-asif4517-git-github-io]
    paths: [scripts/capture-realshift.mjs, .github/workflows/capture-realshift.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-realshift.mjs
      - name: Save genuine browser captures to this working branch
        if: always()
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out=Path('images/realshift')
          out.mkdir(parents=True,exist_ok=True)
          for p in Path('capture-output/realshift').glob('*.png'):
              if p.name.startswith('error'):
                  continue
              Image.open(p).convert('RGB').save(out/(p.stem+'.webp'),quality=87,method=6)
          PY
          cp capture-output/realshift/report.json docs/realshift-browser-capture.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add images/realshift docs/realshift-browser-capture.json
          git commit -m "Capture genuine RealShift browser UI and simulated dyno interactions"
          git push origin HEAD:arena/c802f41f-asif4517-git-github-io
