name: Capture live Neon Rush
on:
  workflow_dispatch:
  push:
    branches: [arena/5b0bcce7-asif4517-git-github-io]
    paths: [scripts/capture-neon.mjs, .github/workflows/capture-neon.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-neon.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-live-browser
          path: capture-output/
