name: Capture live Neon Rush
on:
  workflow_dispatch:
  push:
    branches: [arena/5b0bcce7-asif4517-git-github-io]
    paths: [scripts/capture-neon.mjs, .github/workflows/capture-neon.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-neon.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-live-browser
          path: capture-output/
      - name: Save verified browser captures to the working branch
        run: |
          python -m pip install Pillow
          python - <<'PYCODE'
          from pathlib import Path
          from PIL import Image
          out = Path('images/updates')
          out.mkdir(parents=True, exist_ok=True)
          for p in Path('capture-output').glob('*.png'):
              Image.open(p).convert('RGB').save(out / ('neon-live-' + p.stem + '.webp'), quality=88, method=6)
          PYCODE
          mkdir -p docs
          cp capture-output/report.json docs/neon-browser-capture.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add images/updates/neon-live-*.webp docs/neon-browser-capture.json
          git commit -m "Add genuine live-game browser screenshots and interaction evidence"
          git push origin HEAD:arena/5b0bcce7-asif4517-git-github-io
