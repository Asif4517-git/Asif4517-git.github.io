name: capture-previews
on:
  push:
    paths:
      - '.github/workflows/_capture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Capture live previews
        run: |
          set -e
          mkdir -p .captures
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, os
          targets = {
            'chemlab-home': 'https://chemlab-kerala.vercel.app/',
            'chemlab-lab': 'https://chemlab-kerala.vercel.app/lab/',
            'chemlab-periodic': 'https://chemlab-kerala.vercel.app/periodic-table/',
            'chemlab-chapters': 'https://chemlab-kerala.vercel.app/chapters/',
          }
          for name, url in targets.items():
              api = 'https://api.microlink.io/?' + urllib.parse.urlencode({'url': url, 'screenshot': 'true', 'meta': 'false'})
              try:
                  with urllib.request.urlopen(api, timeout=90) as r:
                      d = json.load(r)
                  img = d['data']['screenshot']['url']
                  with urllib.request.urlopen(img, timeout=90) as r:
                      data = r.read()
                  open('.captures/%s.png' % name, 'wb').write(data)
                  print('captured', name, len(data))
              except Exception as e:
                  print('failed', name, repr(e))
          PY
          ls -la .captures
      - name: Optimise
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          os.makedirs('images/previews', exist_ok=True)
          for p in glob.glob('.captures/*.png'):
              im = Image.open(p).convert('RGB')
              im.thumbnail((1400, 1000))
              out = 'images/previews/' + os.path.basename(p).replace('.png', '.webp')
              im.save(out, 'WEBP', quality=78, method=6)
              print(out, os.path.getsize(out))
          PY
      - name: Commit previews
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "Arena capture bot"
          git config user.email "actions@users.noreply.github.com"
          git add images/previews
          git commit -m "Add captured live site previews" || echo "nothing to commit"
          git push origin "HEAD:$REF"
